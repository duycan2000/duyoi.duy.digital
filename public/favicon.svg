<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5cc0ff"/>
      <stop offset=".5" stop-color="#2f6fe4"/>
      <stop offset="1" stop-color="#1d3eb0"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a3698"/>
      <stop offset="1" stop-color="#0f2266"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="letter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d6e3ff"/>
    </linearGradient>
    <radialGradient id="ball" cx=".35" cy=".3" r=".75">
      <stop offset="0" stop-color="#fff6cf"/>
      <stop offset=".35" stop-color="#ffcf3a"/>
      <stop offset="1" stop-color="#e07b00"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <!-- bóng đổ dưới khối -->
  <ellipse cx="64" cy="120" rx="44" ry="6" fill="#0f2266" opacity=".28" filter="url(#soft)"/>
  <!-- thân khối (độ dày) -->
  <rect x="10" y="16" width="108" height="100" rx="28" fill="url(#side)"/>
  <!-- mặt trên -->
  <rect x="10" y="8" width="108" height="100" rx="28" fill="url(#face)"/>
  <!-- ánh sáng phản chiếu -->
  <path d="M38 10h52a26 26 0 0 1 26 26v4C96 30 72 26 64 26S30 30 12 40v-4a26 26 0 0 1 26-26z" fill="url(#gloss)"/>
  <!-- chữ D: lớp sâu rồi lớp mặt -->
  <path d="M40 34h18c18 0 28 10 28 26s-10 26-28 26H40z" fill="none" stroke="#0f2266" stroke-opacity=".55" stroke-width="11" stroke-linejoin="round" transform="translate(3 5)"/>
  <path d="M40 34h18c18 0 28 10 28 26s-10 26-28 26H40z" fill="none" stroke="url(#letter)" stroke-width="11" stroke-linejoin="round"/>
  <!-- chấm vàng (dấu ơ) dạng cầu -->
  <circle cx="91" cy="31" r="12" fill="#a65a00" opacity=".45" transform="translate(2 4)"/>
  <circle cx="91" cy="31" r="12" fill="url(#ball)"/>
  <ellipse cx="87" cy="26" rx="4.5" ry="3" fill="#fff" opacity=".85"/>
</svg>
